---

####################################################################
# Example : Hostgroup Playbook
####################################################################
- name: Hostgroup Module
  hosts: localhost
  gather_facts: false
  collections:
    - hitachivantara.vspone_block.vsp

  vars_files:
    - ~/playbooks/ansible_vault_vars/ansible_vault_storage_var.yml
    - vsp_direct_global_variables.yml

  vars:
    # Common connection info for all tasks
    connection_info:
      address: "{{ storage_address }}"
      username: "{{ vault_storage_username }}"
      password: "{{ vault_storage_secret }}"

  tasks:
    #######################################################################
    # Task : Create hostgroup and update host mode & options for each node
    #######################################################################
    - name: Create or update default hostgroup for PORT1 with updated host mode options for all SAP HANA nodes
      hitachivantara.vspone_block.vsp.hv_hg:
        connection_info: "{{ connection_info }}"
        storage_system_info:
          serial: "{{ storage_serial }}"
        state: "{{ state_present }}"
        spec:
          state: "{{ substate_set_host_mode_and_hmo }}"
          name: "{{ item.port1[2:5] | replace('-', '') }}-G00"
          port: "{{ item.port1 }}"
          host_mode: "{{ hostgroup_host_mode }}"
          host_mode_options: "{{ hostgroup_host_mode_options }}"
      loop: "{{ sap_hana_nodes }}"
      loop_control:
        label: "{{ item.hostname }}"
      register: result_hg1_create
      ignore_errors: true
      
    - name: Create or update default hostgroup for PORT2 with updated host mode options for all SAP HANA nodes
      hitachivantara.vspone_block.vsp.hv_hg:
        connection_info: "{{ connection_info }}"
        storage_system_info:
          serial: "{{ storage_serial }}"
        state: "{{ state_present }}"
        spec:
          state: "{{ substate_set_host_mode_and_hmo }}"
          name: "{{ item.port2[2:5] | replace('-', '') }}-G00"
          port: "{{ item.port2 }}"
          host_mode: "{{ hostgroup_host_mode }}"
          host_mode_options: "{{ hostgroup_host_mode_options }}"
      loop: "{{ sap_hana_nodes }}"
      loop_control:
        label: "{{ item.hostname }}"
      register: result_hg2_create
      ignore_errors: true

    ####################################################################
    # Task : Add WWNs to the deafult hostgroups
    ####################################################################
    - name: Add WWN to PORT1 of the default hostgroup -G00
      hitachivantara.vspone_block.vsp.hv_hg:
        connection_info: "{{ connection_info }}"
        storage_system_info:
          serial: "{{ storage_serial }}"
        state: "{{ state_present }}"
        spec:
          state: "{{ substate_add_wwn }}"
          name: "{{ item.port1[2:5] | replace('-', '') }}-G00"
          port: "{{ item.port1 }}"
          wwns: 
            - wwn: "{{ item.wwn1 }}"
      loop: "{{ sap_hana_nodes }}"
      loop_control:
        label: "Adding WWNs for PORT1 of {{ item.hostname }}"
      register: result_add_wwn1
      ignore_errors: true

    - name: Add WWN to PORT2 of the default hostgroup -G00
      hitachivantara.vspone_block.vsp.hv_hg:
        connection_info: "{{ connection_info }}"
        storage_system_info:
          serial: "{{ storage_serial }}"
        state: "{{ state_present }}"
        spec:
          state: "{{ substate_add_wwn }}"
          name: "{{ item.port2[2:5] | replace('-', '') }}-G00"
          port: "{{ item.port2 }}"
          wwns: 
            - wwn: "{{ item.wwn2 }}"
      loop: "{{ sap_hana_nodes }}"
      loop_control:
        label: "Adding WWNs for PORT2 of {{ item.hostname }}"
      register: result_add_wwn2
      ignore_errors: true

